[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-navigator"
version = "0.2.0"
description = "LLM-powered spec compliance verifier for web applications"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "litellm>=1.40",
    "playwright>=1.40",
    "python-dotenv>=1.0",
]

[project.scripts]
intelligent-navigator = "intelligent_navigator.__main__:main"

[tool.setuptools.packages.find]
include = ["intelligent_navigator*"]
